# Production-like deployment: the RDAP server behind Caddy, which obtains
# and renews the TLS certificate from Let's Encrypt on its own.
#
#   RDAP_HOST=rdap-test.bcsec.io docker compose up -d
#
# The RDAP server is not exposed directly: only Caddy listens on 80/443.
# To enable the "referring to a service" arrangement on the first instance
# set RDAP_REFERRAL=1.
#
# A second instance of the same server, with the referral arrangement always
# ON, answers under RDAP_REFERRAL_HOST (service rdap-referral):
#
#   RDAP_HOST=rdap-test.bcsec.io RDAP_REFERRAL_HOST=rdap-referral.bcsec.io \
#     docker compose up -d
#
# A third instance runs the same program as an assessment service, under
# RDAP_ASSESSOR_HOST (service rdap-assessor). Set RDAP_ASSESSOR_BASE_URL to
# its public URL to make the referral instance link to it; left empty, the
# referral instance simulates the assessment service under /assessor/.
#
# Extension versioning is OFF for the first three instances. The switch
# RDAP_VERSIONING=1 (Point Versioning declared on the registered identifier,
# a trial of 15 November 2026) is no longer set for rdap-referral and
# rdap-assessor: extension versioning is shown by the fourth instance only.
#
# A fourth instance, under RDAP_EXPERIMENTAL_HOST (service rdap-experimental),
# runs the transition experiment (RDAP_TRANSITION=1): the registered
# identifier stays opaque and default, and a PLACEHOLDER successor with Point
# Versioning is returned on request (Sections 4 and 7.2 of the versioning
# draft). The other three instances do not set the switch and do not change.

services:
  rdap:
    build: ..
    image: rdap-ra-proto:latest
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      RDAP_BASE_URL: "https://${RDAP_HOST:-localhost}"
      RDAP_REFERRAL: "${RDAP_REFERRAL:-0}"
    command: ["--port", "8080", "--base-url", "https://${RDAP_HOST:-localhost}"]
    expose:
      - "8080"

  # Same image, referral arrangement ON, its own public name.
  rdap-referral:
    image: rdap-ra-proto:latest
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      RDAP_BASE_URL: "https://${RDAP_REFERRAL_HOST:-referral.localhost}"
      RDAP_REFERRAL: "1"
      RDAP_ASSESSOR_BASE_URL: "${RDAP_ASSESSOR_BASE_URL:-}"
    command: ["--port", "8080", "--base-url", "https://${RDAP_REFERRAL_HOST:-referral.localhost}"]
    expose:
      - "8080"
    depends_on:
      - rdap

  # Same image, run as an assessment service: not authoritative, minimal
  # responses from data/assessor/.
  rdap-assessor:
    image: rdap-ra-proto:latest
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      RDAP_BASE_URL: "https://${RDAP_ASSESSOR_HOST:-assessor.localhost}"
      RDAP_ASSESSOR_ONLY: "1"
    command: ["--port", "8080", "--base-url", "https://${RDAP_ASSESSOR_HOST:-assessor.localhost}"]
    expose:
      - "8080"
    depends_on:
      - rdap

  # Same image, transition experiment ON, its own public name. Authoritative
  # server with the result carried in the response; no referral.
  rdap-experimental:
    image: rdap-ra-proto:latest
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      RDAP_BASE_URL: "https://${RDAP_EXPERIMENTAL_HOST:-experimental.localhost}"
      RDAP_TRANSITION: "1"
    command: ["--port", "8080", "--base-url", "https://${RDAP_EXPERIMENTAL_HOST:-experimental.localhost}"]
    expose:
      - "8080"
    depends_on:
      - rdap

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RDAP_HOST: "${RDAP_HOST:-localhost}"
      RDAP_REFERRAL_HOST: "${RDAP_REFERRAL_HOST:-referral.localhost}"
      RDAP_ASSESSOR_HOST: "${RDAP_ASSESSOR_HOST:-assessor.localhost}"
      RDAP_EXPERIMENTAL_HOST: "${RDAP_EXPERIMENTAL_HOST:-experimental.localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rdap
      - rdap-referral
      - rdap-assessor
      - rdap-experimental

volumes:
  caddy_data:
  caddy_config:
