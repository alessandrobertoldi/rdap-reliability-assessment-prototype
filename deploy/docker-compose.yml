# Production-like deployment: the RDAP server behind Caddy, which obtains
# and renews the TLS certificate from Let's Encrypt on its own.
#
#   RDAP_HOST=rdap-test.bcsec.io docker compose up -d
#
# The RDAP server is not exposed directly: only Caddy listens on 80/443.
# To enable the -04 "referring to a service" arrangement set RDAP_REFERRAL=1.

services:
  rdap:
    build: ..
    image: rdap-ra-proto:latest
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      RDAP_BASE_URL: "https://${RDAP_HOST:-localhost}"
      RDAP_REFERRAL: "${RDAP_REFERRAL:-0}"
    command: ["--port", "8080", "--base-url", "https://${RDAP_HOST:-localhost}"]
    expose:
      - "8080"

  caddy:
    image: caddy:2.11
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RDAP_HOST: "${RDAP_HOST:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rdap

volumes:
  caddy_data:
  caddy_config:
